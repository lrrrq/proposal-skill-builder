name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cross-platform:
    name: smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with runtime dependencies)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Smoke test (cross-platform invariants)
        shell: bash
        run: |
          python tests/test_cross_platform.py -v

      - name: Smoke test on Windows (cmd.exe)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          python tests\test_cross_platform.py -v

      - name: CLI smoke (status + drift inspect)
        shell: bash
        run: |
          # `init` then `status` then `inspect-source-drift` should all
          # exit cleanly on every platform.
          python -m skill_builder.cli init || true
          python -m skill_builder.cli status
          python -m skill_builder.cli inspect-source-drift