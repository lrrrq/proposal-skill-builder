brand: m-films
version: 0.1.0

# M Films 词汇系统 - 基于 VI 手册 + 5 年设计文案调研

recommended:
  # 品牌口号
  - "追求极致"
  - "创造惊喜"
  - "简约纯粹"
  - "大气实用"
  - "不止于影像"
  # 调性关键词
  - "极简"
  - "电影感"
  - "国际化"
  - "现代"
  - "先锋"
  - "不设限"
  # 海报主题词（2024-2025）
  - "We are MPLUS"
  - "一切皆 LOVE"
  - "历未知 做热爱"
  - "超月无限"
  - "新出发"
  - "社群共创"

discouraged:
  # 不是 M Films 调性的词
  - "奢华"  # 改用 "先锋" "国际化"
  - "高端定制"  # 改用 "先锋" "国际化"
  - "赋能"  # 单独出现需改写
  - "焕新"  # 改用 "新出发" "超月无限"
  - "沉浸式升级"  # 改用 "科幻" "未来感"
  - "传统中国风"  # 改用 "新国潮" "新中式"
  - "可爱卡通"  # 改用 "3D 潮玩"
  # 错误品牌色相关
  - "奢华金 #C9A962"  # 不属于 M Films 视觉
  - "深空灰 #1A1A2E"  # 之前抄错的客户色
  - "暗夜黑高端"  # 不属于 M Films 调性

style_markers:
  always_use:
    - "极简"
    - "电影感"
    - "现代"
    - "国际化"
  avoid:
    - "传统"
    - "古典"
    - "奢华"
    - "定制"
    - "高端"
