brand: m-films
version: 0.1.0
note: M Films 4 段式提案骨架 - 基于 49 案例章节统计（90%+ 遵循）

default_4_section:
  - name: 创意背景
    english: Creative Background
    purpose: 市场/品牌/受众洞察
    typical_pages: 2-3
    note: 用 1-3 段说明新项目的核心背景、品牌处境、受众需求

  - name: 创意概要
    english: Creative Summary
    purpose: 核心命题 + 创意概念 + 策略路径
    typical_pages: 3-4
    subsections:
      - 核心命题
      - 创意概念
      - 策略路径

  - name: 创意脚本
    english: Creative Script
    purpose: 3 个内容模块的执行方案
    typical_pages: 4-6
    default_module_count: 3

  - name: 参考片 + 调性
    english: Reference Films + Tone
    purpose: 视觉锚定 + 节奏
    typical_pages: 2-3
    subsections:
      - 推荐参考片
      - 视觉调性
      - 节奏

total_pages: 12-16
note: "60%+ M Films 真实案例在 12-15 页范围"

# 行业变体（基于 brief 行业关键词）
industry_overrides:
  annual_gala:
    insert_after: 创意概要
    additional_section: 主题演绎
    note: 年会场景常在创意概要后加"主题演绎"章

  product_launch:
    replace: 创意脚本
    with: 传播节奏 + 触点设计
    note: 发布会场景的"创意脚本"常拆成"传播节奏+触点"

  documentary:
    extend: 创意脚本
    additional: 拍摄计划 + 预算
    note: 纪录片场景在创意脚本后加拍摄计划

  festival:
    add: 节日情绪锚点（在创意背景中）
    note: 节日场景在背景洞察中加"节日情绪锚点"

# 跨公司复用
cross_company:
  note: "换公司时只换 brand-style-pack 目录，chapter_naming.yaml 可保持通用"
  restraint: "新公司 pack 可覆盖本章命名规则"
